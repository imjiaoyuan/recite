name: Deploy sync worker

# Builds the site and ships it + the sync worker to Cloudflare in one go.
# The deployment serves BOTH the app (static assets) and the sync API on the
# same origin — opening it is all the setup a device needs: the page is
# stamped with <meta name="recite-sync"> and hides the server-URL field.
#
# NOTE: this workflow is only needed when deploying with an API token from
# GitHub Actions. If you instead use Cloudflare's Git integration (Workers
# Builds) or the Deploy to Cloudflare button, cloud-side builds run the
# repo-root package.json scripts (`build` + `deploy`) against the root
# wrangler.jsonc on every push — you can delete this workflow entirely.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'workers/sync/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-sync.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler@latest requires >=22
          cache: npm

      - run: npm ci
      - run: npm run build

      # wrangler.jsonc sits at the repo root, so a plain `npx wrangler deploy`
      # (via the pinned devDependency) works from the default working directory
      # — same command the cloud-side Git-integration build runs.
      # NOTE: secrets can't be referenced in `if:` (GitHub rejects the file),
      # so the no-token case is handled inside the script.
      - name: Deploy worker (site + sync API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — worker not auto-deployed. Use Cloudflare's Git integration, the Deploy button, or npm run deploy:worker."
            exit 0
          fi
          npx wrangler deploy
