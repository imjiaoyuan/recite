<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>recite</title>
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#2e4dd6" />
    <!-- Apply theme before paint to avoid flash. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('recite:meta');
          var theme = raw ? JSON.parse(raw).theme || 'auto' : 'auto';
          var dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Resolve the UI language before paint: the splash text and the tab title are
         the first things on screen, so neither should flash the wrong language while
         the bundle loads. public/lang.js owns the logic; src/i18n.ts re-uses it. -->
    <!-- Vite warns this can't be bundled without type="module" — that is the point:
         a module script is deferred past the first paint, which is what we're avoiding. -->
    <script src="lang.js"></script>
    <script>
      // lang.js may be unavailable (a hostile network, a broken deploy) — the static
      // lang="en"/<title>recite</title> defaults above stand in for it.
      try { window.__reciteLang = window.reciteLang.apply(); } catch (e) {}
    </script>
    <!-- Splash shown before the JS bundle loads; faded out by main.ts once data is ready. -->
    <style>
      #boot{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#faf8f4;color:#1f1d1a;transition:opacity .35s ease}
      html.dark #boot{background:#141318;color:#ece9e3}
      #boot.hide{opacity:0;pointer-events:none}
      #boot .wm{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Songti SC','Noto Serif SC',serif;font-weight:600;font-size:42px;letter-spacing:-.5px;animation:bpulse 1.6s ease-in-out infinite}
      #boot .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a756b;font-family:ui-monospace,Menlo,Consolas,monospace}
      html.dark #boot .sub{color:#9c968c}
      #boot .spin{width:38px;height:38px;border:4px solid rgba(46,77,214,.18);border-top-color:#2e4dd6;border-radius:50%;animation:bspin .8s linear infinite}
      html.dark #boot .spin{border-color:rgba(138,160,255,.18);border-top-color:#8aa0ff}
      @keyframes bspin{to{transform:rotate(360deg)}}
      @keyframes bpulse{0%,100%{opacity:1}50%{opacity:.4}}
      @media (prefers-reduced-motion:reduce){#boot .spin{animation-duration:.001ms}#boot .wm{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="wm">recite</div>
      <div class="sub" id="boot-sub">loading…</div>
      <div class="spin"></div>
    </div>
    <script>(function(){try{document.getElementById('boot-sub').textContent=window.reciteLang.bootText(window.__reciteLang);}catch(e){}})();</script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
